<div class="container mt-5">
  <h3>Add New Employee</h3>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name</label>
      <input formControlName="name" class="form-control" />
      <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger">
        Name is required
      </div>
    </div>

    <div class="form-group mt-3">
      <label>Department</label>
      <input formControlName="department" class="form-control" />
      <div *ngIf="form.get('department')?.invalid && form.get('department')?.touched" class="text-danger">
        Department is required
      </div>
    </div>

    <div class="form-group mt-3">
      <label>Email</label>
      <input formControlName="email" class="form-control" />
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger">
        Valid email is required
      </div>
    </div>

    <button class="btn btn-primary mt-3" [disabled]="form.invalid">
  {{ form.value.id === 0 ? 'Add' : 'Update' }} Employee
</button>

  </form>

  <hr />

  <h4>Employee List</h4>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.name }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.email }}</td>
        <td>
          <button class="btn btn-sm btn-primary" (click)="edit(emp)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="delete(emp.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
